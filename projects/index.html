<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <title>Projects</title>
</head>

<body>
    <main class="container-fluid projects-page py-4 py-lg-5">
        <section class="projects-intro mb-4">
            <p class="eyebrow mb-2">Selected work</p>
            <h1 class="display-5 mb-2">Projects</h1>
            <p class="lead mb-4">Data systems, machine learning, and applied analysis.</p>
            <div class="search-wrap">
                <label class="visually-hidden" for="project-search">Search projects</label>
                <input id="project-search" class="searchBar form-control form-control-lg" type="search" aria-label="Search projects" placeholder="Search projects..." />
            </div>
        </section>

        <section class="project-explorer" aria-label="Project timeline">
            <div class="container-chart">
                <svg id="projects-pie-plot" role="img" aria-label="Projects by year"></svg>
                <ul class="legend"></ul>
            </div>
        </section>

        <section class="projects mt-4" aria-live="polite">
            <!-- Projects will be dynamically inserted here -->
        </section>
    </main>

    <script src="projects.js" type="module"></script>
</body>

</html>
